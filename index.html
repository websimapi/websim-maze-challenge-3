<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Challenge</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">

            "imports": {

<body>
    <div class="container">
        <h1>Finish this maze to receive unlimited cake</h1>
        <div id="maze-container">
            <div id="maze"></div>
            <div id="player"></div>
            <div id="treasure" class="hidden">
                <div id="play-button"></div>
            </div>
        </div>
        <div id="controls">
            <div class="controls-row">
                <button id="up">↑</button>
            </div>
            <div class="controls-row">
                <button id="left">←</button>
                <button id="right">→</button>
            </div>
            <div class="controls-row">
                <button id="down">↓</button>
            </div>
        </div>
        <div id="message">Use arrow keys or buttons to navigate the maze!</div>
    </div>
